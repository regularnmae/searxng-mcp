name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv run --frozen ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Config lives in [tool.pyright]: standard mode over server.py,
      # healthcheck.py, tests and scripts.
      - run: uv run --frozen pyright

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # --frozen: use the committed lock, never re-resolve in CI.
      - run: uv run --frozen pytest -q
      # Boots the real ASGI app on loopback and checks that /health is
      # open, /mcp is gated with no token, and a valid token completes
      # an MCP handshake.
      - run: uv run --frozen python scripts/smoke.py

  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Fails when pyproject.toml has changed without `uv lock` being
      # re-run, which is the only way uv.lock goes stale.
      - run: uv lock --check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Export the lock the way the image installs it
        run: |
          uv export --format requirements-txt --no-dev --no-emit-project \
            --locked -o requirements-audit.txt
      - name: Audit
        run: |
          uvx pip-audit@2.10.1 --requirement requirements-audit.txt

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: |
          podman build -t searxng-mcp:ci .
      - name: Build tools are not in the runtime image
        run: |
          container_id=$(podman run -d -e SEARXNG_MCP_TOKEN=ci-token \
            -e MCP_HOST=127.0.0.1 -e MCP_PORT=8000 searxng-mcp:ci)
          podman exec "$container_id" sh -c 'command -v uv || command -v pip' \
            && { echo "uv or pip leaked into the runtime image"; exit 1; } \
            || echo "no uv or pip in the runtime image"
          podman exec "$container_id" python -c \
            'import mcp, httpx2, pypdf, uvicorn; print("deps present")'
          # /health open, everything else gated.
          podman exec "$container_id" python -c "
          import urllib.request, urllib.error
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)
          try:
              urllib.request.urlopen(urllib.request.Request(
                  'http://127.0.0.1:8000/mcp', data=b'{}', method='POST',
                  headers={'Content-Type': 'application/json'}), timeout=5)
              raise SystemExit('unauthorised request was served')
          except urllib.error.HTTPError as err:
              assert err.code == 401, err.code
          print('health open, mcp gated')
          "
          podman rm -f "$container_id"
